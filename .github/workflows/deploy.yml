name: Deploy static site with Linting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Задание 1. Автоматическая валидация синтаксиса и качества HTML-кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run HTML5 Linter & Validator
        run: |
          npm install -g htmlhint
          htmlhint index.html --rules tag-pair,attr-lowercase,id-unique

  # Задание 2. Публикация сайта на GitHub Pages (только после успешного линтинга)
  deploy:
    needs: [lint]             # Строгая зависимость от линтинга (Fail-Fast)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
